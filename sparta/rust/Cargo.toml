[package]
name = "sparta"
license = "MIT"
description = "SPARTA is a library of software components specially designed for building high-performance static analyzers based on the theory of Abstract Interpretation."
homepage = "https://github.com/facebook/sparta"
repository = "https://github.com/facebook/sparta"
version = "0.1.3"
edition = "2021"

[dependencies]
smallvec = { version = "1.9.0", features = ["const_generics"] }
disjoint-sets = "0.4.2"
im = "15.1.0"
petgraph = "0.6.2"
sparta-proc-macros = { path = "../rust-proc-macros", version = "0.1.1" }
# `default-features = false` drops the optional serde (and its syn/proc-macro
# chain) and stable_deref_trait dependencies, which this crate does not use.
triomphe = { version = "0.1.16", default-features = false, features = ["std"] }

[dev-dependencies]
rand = "0.10"
